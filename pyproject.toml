[tool.poetry]
name = "reflex-admin-poc"
version = "0.1.0"
description = "POC: a semantic admin framework for Reflex, SQLAlchemy, Pydantic"
authors = ["reflex-admin <dev@example.com>"]
packages = [{include = "reflex_admin", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10 || ^3.11"
SQLAlchemy = "^1.4"
pydantic = "^1.10"
psycopg2-binary = "^2.9"
alembic = "^1.11"
pytest = "^7.0"
typing-extensions = "^4.0"
# Reflex (optional UI). Install only if you want to run the UI.
reflex = {version = "^0.1", optional = true}

[tool.poetry.extras]
ui = ["reflex"]

[tool.poetry.dev-dependencies]
pytest = "^7.2"
pytest-asyncio = "^0.20"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
